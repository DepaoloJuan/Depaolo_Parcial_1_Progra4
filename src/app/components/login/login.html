<!-- Pantalla de inicio de sesión -->
<div class="row justify-content-center">
  <div class="col-12 col-md-5">

    <!-- Título -->
    <div class="text-center mb-4">
      <i class="bi bi-controller display-4 text-primary"></i>
      <h2 class="fw-bold mt-2">Iniciar Sesión</h2>
      <p class="text-muted">Ingresá a la Sala de Juegos</p>
    </div>

    <!-- Formulario de login -->
    <div class="card shadow-sm">
      <div class="card-body p-4">

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

          <!-- Mensaje de error -->
          @if (errorMensaje()) {
            <div class="alert alert-danger py-2 small">
              <i class="bi bi-exclamation-triangle me-1"></i>{{ errorMensaje() }}
            </div>
          }

          <!-- Campo email -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="tu@email.com"
              [(ngModel)]="email"
              name="email"
              required
              email
              #emailField="ngModel"
            />
            @if (emailField.invalid && emailField.touched) {
              <div class="text-danger small mt-1">
                <i class="bi bi-exclamation-circle me-1"></i>Ingresá un email válido
              </div>
            }
          </div>

          <!-- Campo contraseña -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Contraseña</label>
            <input
              type="password"
              class="form-control"
              placeholder="Mínimo 6 caracteres"
              [(ngModel)]="password"
              name="password"
              required
              minlength="6"
              #passField="ngModel"
            />
            @if (passField.invalid && passField.touched) {
              <div class="text-danger small mt-1">
                <i class="bi bi-exclamation-circle me-1"></i>Mínimo 6 caracteres
              </div>
            }
          </div>

          <!-- Botón submit -->
          <button
            type="submit"
            class="btn btn-primary w-100 mb-3"
            [disabled]="loginForm.invalid || cargando()"
          >
            @if (cargando()) {
              <span class="spinner-border spinner-border-sm me-2"></span>Ingresando...
            } @else {
              <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
            }
          </button>

          <!-- Separador -->
          <hr class="my-3">

          <!-- Botones de acceso rápido -->
          <p class="text-center text-muted small mb-2">Acceso rápido para pruebas</p>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm flex-grow-1"
              (click)="email='probando@test.com'; password='123456'; onSubmit()">
              Usuario 1
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm flex-grow-1"
              (click)="email='usuario2@prueba.com'; password='123456'; onSubmit()">
              Usuario 2
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm flex-grow-1"
              (click)="email='usuario3@prueba.com'; password='123456'; onSubmit()">
              Usuario 3
            </button>
          </div>

        </form>

      </div>
    </div>

    <!-- Link a registro -->
    <p class="text-center mt-3 text-muted">
      ¿No tenés cuenta?
      <a routerLink="/registro" class="text-primary fw-semibold">Registrate acá</a>
    </p>

  </div>
</div>
